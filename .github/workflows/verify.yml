name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Source and UI unit contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check_repository.py
      - run: npm run check && npm test
      - run: python tests/python_test.py
  dotnet:
    name: .NET 10 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Observatory.slnx
      - run: dotnet build Observatory.slnx -c Release --no-restore
      - run: dotnet test tests/Observatory.Tests/Observatory.Tests.csproj -c Release --no-build --logger trx --results-directory artifacts/tests
      - run: dotnet publish src/Observatory.Web/Observatory.Web.csproj -c Release --no-build -o artifacts/publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-${{ matrix.os }}
          path: artifacts/tests/
          if-no-files-found: warn
  browser:
    name: Real ASP.NET authentication and native Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r tests/requirements.txt && python -m playwright install --with-deps chromium
      - name: Test CSP probe with positive and negative browser controls
        run: python tests/csp_test.py
      - name: Publish and start actual application
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/Observatory.Web/Observatory.Web.csproj -c Release -o artifacts/publish
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "SPO_ACCESS_KEY=$key" >> "$GITHUB_ENV"
          export SPO_ACCESS_KEY="$key"
          export ASPNETCORE_URLS=http://localhost:5080
          export Observatory__PublicOrigin=http://localhost:5080
          export Observatory__StateDirectory="$RUNNER_TEMP/observatory-state"
          (cd artifacts/publish && dotnet Observatory.Web.dll) > artifacts/server.log 2>&1 &
          echo $! > artifacts/server.pid
          python scripts/wait_http.py http://localhost:5080/health/live
      - run: python tests/api_smoke.py
      - name: Start a fresh login rate window for browser checks
        # API negative tests intentionally consume login rate permits.
        run: sleep 62
      - name: Native browser navigation (no fixture or DOM bridge)
        run: python tests/ui_test.py --base-url http://localhost:5080
      - name: Stop server
        if: always()
        run: if [ -f artifacts/server.pid ]; then kill "$(cat artifacts/server.pid)" || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aspnet-browser-evidence
          path: |
            artifacts/server.log
            artifacts/api-smoke.json
            artifacts/csp-controls/
            artifacts/ui/
          if-no-files-found: warn
