# Opt-in local laboratory ONLY. Read docs/en/lab-guide.md first.
services:
  sql-lab:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: ${SPO_ACCEPT_SQL_EULA:?Read and accept the SQL Server Developer license by setting Y}
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SPO_LAB_SA_PASSWORD:?Set a strong lab-only password}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - sql-lab-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  sql-lab-data:
